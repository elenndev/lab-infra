name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Docker image to deploy"
        require: true
        type: string

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy backend
        env:
          LAB_INFRA_DIR: ${{ vars.LAB_INFRA_DIR }}
          IMAGE: ${{ inputs.image }}
        run: |
          if [ ! -d "$LAB_INFRA_DIR" ]; then
            echo "Infrastructure directory not found: $LAB_INFRA_DIR"
            exit 1
          fi
          cd "$LAB_INFRA_DIR"
          ./scripts/deploy.sh "$IMAGE"
